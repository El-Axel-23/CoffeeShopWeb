    <!-- Contenido principal -->

                <div class="col-lg-6">

                    <img src="../img/cafe-login.jpg"

                </div>

                <!-- Formulario de registro -->
                <div class="col-lg-5">

                    <div class="tarjeta-registro">

                        <!-- Encabezado -->
                        <div class="encabezado-registro">

                            <a href="login.php"
                               class="boton-regresar"
                               aria-label="Regresar">

                                <i class="bi bi-arrow-left"></i>

                            </a>

                            <h1>Crea tu cuenta</h1>

                            <i class="bi bi-cup-hot icono-cafe"></i>

                        </div>

                        <p class="subtitulo">
                            Regístrate para pedir más rápido
                        </p>

                        <!-- Mensaje de error -->
                        <div id="mensajeError"
                             class="alert alert-danger {{clase_error}}"
                             role="alert">

                            {{mensaje_error}}

                        </div>

                        <form id="formRegistro"
                              action="registro.php"
                              method="POST"
                              novalidate>

                            <!-- Token de seguridad -->
                            <input type="hidden"
                                   name="csrf_token"
                                   value="{{csrf_token}}">

                            <!-- Nombre completo -->
                            <div class="campo-registro">

                                <label for="nombre_completo">
                                    Nombre completo
                                </label>

                                <input type="text"
                                       id="nombre_completo"
                                       name="nombre_completo"
                                       placeholder="Escribe tu nombre completo"
                                       maxlength="120"
                                       autocomplete="name"
                                       value="{{nombre_completo}}"
                                       required>

                            </div>

                            <!-- Correo electrónico -->
                            <div class="campo-registro">

                                <label for="correo">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                       id="correo"
                                       name="correo"
                                       placeholder="Escribe tu correo electrónico"
                                       maxlength="120"
                                       autocomplete="email"
                                       value="{{correo}}"
                                       required>

                            </div>

                            <!-- Contraseña -->
                            <div class="campo-registro">

                                <label for="contrasena">
                                    Contraseña
                                </label>

                                <div class="campo-contrasena">

                                    <input type="password"
                                           id="contrasena"
                                           name="contrasena"
                                           placeholder="Escribe tu contraseña"
                                           minlength="8"
                                           autocomplete="new-password"
                                           required>

                                    <button type="button"
                                            id="btnMostrarContrasena"
                                            class="boton-ojo"
                                            aria-label="Mostrar contraseña">

                                        <i id="iconoContrasena"
                                           class="bi bi-eye-slash"></i>

                                    </button>

                                </div>

                            </div>

                            <p class="requisito-contrasena">
                                Mínimo 8 caracteres
                            </p>

                            <!-- Confirmar contraseña -->
                            <div class="campo-registro">

                                <label for="confirmar_contrasena">
                                    Confirmar contraseña
                                </label>

                                <div class="campo-contrasena">

                                    <input type="password"
                                           id="confirmar_contrasena"
                                           name="confirmar_contrasena"
                                           placeholder="Confirma tu contraseña"
                                           minlength="8"
                                           autocomplete="new-password"
                                           required>

                                    <button type="button"
                                            id="btnMostrarConfirmacion"
                                            class="boton-ojo"
                                            aria-label="Mostrar confirmación de contraseña">

                                        <i id="iconoConfirmacion"
                                           class="bi bi-eye-slash"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Términos y condiciones -->
                            <div class="form-check terminos-registro">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="acepto_terminos"
                                       name="acepto_terminos"
                                       value="1"
                                       {{terminos_marcados}}
                                       required>

                                <label class="form-check-label"
                                       for="acepto_terminos">

                                    Acepto los Términos y condiciones
                                    y el Aviso de privacidad

                                </label>

                            </div>

                            <!-- Crear cuenta -->
                            <button type="submit"
                                    class="btn boton-registro w-100">

                                CREAR CUENTA

                            </button>

                        </form>

                        <!-- Separador -->
                        <div class="separador">
