<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    body{background:#FFF6E9;color:#3B2314;font-family:'Segoe UI',Arial}
    .bg-crema{background:#FFF6E9}
    .bg-beige{background:#F5E8D3}
    .bg-cafe{background:#3B2314 !important;color:#fff !important}
    .text-cafe{color:#3B2314}
    .text-gris{color:#7a6a5a}
    .btn-cafe{background:#3B2314;color:#fff;border-radius:10px;padding:10px;font-weight:700;width:100%}
    .btn-cafe:hover{background:#5a3a22;color:#fff}
    .chip{border:none;padding:6px 14px;border-radius:20px;background:#F5E8D3;font-size:12px}
    .chip.active{background:#3B2314;color:#fff}
    .chip-opt{border:1px solid #EADFCB;background:#F5E8D3;padding:5px 12px;border-radius:20px;font-size:12px}
    .chip-opt.active{background:#3B2314;color:#fff}
    .card-coffee{border:none;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;background:#fff}
    .card-coffee img{height:150px;object-fit:cover}
    .search-input{background:#FFF0D6;border:1px solid #EADFCB;border-radius:20px;padding:10px 15px}
    .noti{background:#F5E8D3;border-radius:12px;padding:14px}
    .vista{display:none}.vista.active{display:block}
    .nav-link{color:#3B2314 !important;font-size:13px;cursor:pointer}
    .nav-link.active{font-weight:700;text-decoration:underline}
    footer{background:#E6D5C3;color:#0D0D0D;font-size:12px}
    footer a{color:#FFF6E9;text-decoration:none;margin-left:15px}
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header class="bg-crema border-bottom sticky-top">
    <div class="container d-flex justify-content-between align-items-center py-2">
        <a href="#" style="color: #0D0D0D; text-decoration: none; font-size: 20px;">
        <i class="bi bi-cup-hot"></i> COFFEE SHOP
        </a>
        <nav class="nav d-none d-md-flex">
        <a class="nav-link active" onclick="ir('inicio',this)">Inicio</a>
        <a class="nav-link" onclick="ir('inicio',this)">Menú</a>
        <a class="nav-link" onclick="ir('favoritos',this)">Favoritos</a>
        <a class="nav-link" onclick="ir('pedidos',this)">Mis pedidos</a>
        <a class="nav-link" onclick="ir('buscar',this)">Buscar</a>
        <a class="nav-link" onclick="ir('notis',this)"><i class="bi bi-bell"></i></a>
        <a class="nav-link"><span class="badge bg-beige text-dark rounded-pill">CE</span></a>
        </nav>
        <button class="btn btn-sm d-md-none" onclick="ir('buscar')"><i class="bi bi-search"></i></button>
    </div>
    </header>

    <!-- NOTIFICACIONES -->
    <div class="container flex-grow-1" style="padding-top: 30px; max-width: 1300px;">

        <h5 style="font-weight: bold; color: #3E2723; margin-bottom: 15px;">Notificaciones</h5>

        <!-- Notificación 1 -->
        <div style="background-color: #F3E9D7; border-radius: 10px; padding: 15px 20px; margin-bottom: 12px;">
            <p style="margin: 0; font-size: 13px; font-weight: 600; color: #3E2723;">
            <i class="bi bi-bell" style="margin-right: 6px;"></i> Tu pedido #1024 está en preparación
            </p>
            <p style="margin: 0; font-size: 11px; color: #8D7B68; margin-top: 4px;">hace 5 min</p>
        </div>

        <!-- Notificación 2 -->
        <div style="background-color: #F3E9D7; border-radius: 10px; padding: 15px 20px; margin-bottom: 12px;">
            <p style="margin: 0; font-size: 13px; font-weight: 600; color: #3E2723;">
            <i class="bi bi-bell" style="margin-right: 6px;"></i> Nuevo en el menú: Latte Vainilla Avena
            </p>
            <p style="margin: 0; font-size: 11px; color: #8D7B68; margin-top: 4px;">hace 2 h</p>
        </div>

    </div> 

    <footer class="footer-coffee py-3 mt-auto">
      <div class="container d-flex flex-wrap justify-content-between align-items-center">
        <span>Coffee Shop · Un momento delicioso en cada sorbo</span>
        <div>
          <a href="inicio.html" class="text-black">Menú</a>
          <a href="ubicación.html" class="text-black">Ubicación</a>
          <a href="ayuda.html" class="text-black">Ayuda</a>
        </div>
      </div>
    </footer>

</body>
</html>
