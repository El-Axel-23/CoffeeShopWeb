                            <a href="index.php" class="boton-regresar"

                        <p class="subtitulo">
                            Actualiza tu información personal
                        </p>

                        <!-- Mensaje de error -->
                        <div id="mensajeError"
                             class="alert alert-danger {{clase_error}}"
                             role="alert">

                            {{mensaje_error}}

                        </div>

                        <form id="formPerfil"
                              action="editar_perfil.php"
                              method="POST"
                              novalidate>

                            <!-- Token de seguridad -->
                            <input type="hidden"
                                   name="csrf_token"
                                   value="{{csrf_token}}">

                            <!-- Nombre completo -->
                            <div class="campo-perfil">

                                <label for="nombre_completo">
                                    Nombre completo
                                </label>

                                <input type="text"
                                       id="nombre_completo"
                                       name="nombre_completo"
                                       value="{{nombre_completo}}"
                                       placeholder="Escribe tu nombre completo"
                                       maxlength="120"
                                       autocomplete="name"
                                       required>

                            </div>

                            <!-- Correo electrónico -->
                            <div class="campo-perfil">

                                <label for="correo">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                       id="correo"
                                       name="correo"
                                       value="{{correo}}"
                                       placeholder="Escribe tu correo electrónico"
                                       maxlength="120"
                                       autocomplete="email"
                                       required>

                            </div>

                            <!-- Número de teléfono -->
                            <div class="campo-perfil">

                                <label for="telefono">
                                    Número de teléfono
                                </label>

                                <input type="tel"
                                       id="telefono"
                                       name="telefono"
                                       value="{{telefono}}"
                                       placeholder="Escribe tu número de teléfono"
                                       maxlength="15"
                                       autocomplete="tel">

                            </div>

                            <!-- Contraseña actual -->
                            <div class="campo-perfil">

                                <label for="contrasena_actual">
                                    Contraseña actual
                                </label>

                                <div class="campo-contrasena">

                                    <input type="password"
                                           id="contrasena_actual"
                                           name="contrasena_actual"
                                           placeholder="Escribe tu contraseña actual"
                                           autocomplete="current-password"
                                           aria-describedby="requisitoContrasena">

                                    <button type="button"
                                            id="btnMostrarContrasena"
                                            class="boton-ojo"
                                            aria-label="Mostrar contraseña">

                                        <i class="bi bi-eye-slash"
                                           id="iconoOjo"></i>

                                    </button>

                                </div>

                            </div>

                            <p id="requisitoContrasena"
                               class="requisito-contrasena">

                                Necesaria únicamente si modificas tu correo.

                            </p>

                            <!-- Guardar cambios -->
                            <button type="submit"

                            </button>

                            <!-- Cancelar -->
                            <a href="index.php"
                               class="btn boton-cancelar w-100">
